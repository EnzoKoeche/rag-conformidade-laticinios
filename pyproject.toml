[project]
name = "rag-laticinios"
version = "0.1.0"
description = "RAG agêntico de conformidade e qualidade em laticínios — citação obrigatória, corrective RAG, retrieval híbrido medido"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=0.4",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "chromadb>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pypdf>=4.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "httpx>=0.27",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "streamlit>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_laticinios"]

# Torch CPU-only (WSL sem GPU): evita os wheels CUDA de vários GB
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/rag_laticinios"]
