# app + vetor store (ADR-001: chroma embedded no dev; servidor http no compose)
#
# Pré-requisito (no host, popula ./data com corpus + cache de embeddings):
#   uv run python scripts/baixar_documentos.py && uv run python scripts/ingerir.py
# Subir:  docker compose up --build
# O Chroma do compose tem volume próprio e começa VAZIO — popular via API (usa o
# cache de embeddings de ./data, sem recomputar nem baixar o modelo de embedding):
#   for d in $(curl -s localhost:8000/health | python3 -c 'import sys,json;print(*json.load(sys.stdin)["documentos"])'); do
#     curl -s -X POST localhost:8000/ingest -H 'content-type: application/json' -d "{\"doc_id\":\"$d\"}"; echo
#   done
# Modelos HF só são baixados pelo container quando necessários (1ª pergunta densa:
# BGE-m3 ~2,3 GB; grader demo: cross-encoder ~0,5 GB) → ./data/hf-cache, persistido.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      RAG_MODO: demo
      CHROMA_MODE: http
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
    volumes:
      - ./data:/data
      - ./data:/app/data
    depends_on:
      - chroma

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/data

volumes:
  chroma-data:
